name: AI Code Reviewer

# Trigger this workflow whenever a Pull Request is opened or updated
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review-pr:
    runs-on: ubuntu-latest

    # Grant permissions to write comments on Pull Requests
    permissions:
      contents: read
      pull-requests: write

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11 environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache dependencies to speed up future workflow runs
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run the CrewAI Code Reviewer script
      - name: Run AI Code Reviewer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py "${{ github.repository }}" "${{ github.event.pull_request.number }}"