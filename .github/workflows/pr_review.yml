name: AI Code Reviewer

# Run trusted repository code with access to repository secrets when a pull
# request is opened or updated. The reviewer reads the PR through the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  review-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m pip --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "import crewai, langchain_groq, github, dotenv; print('Project dependencies imported successfully.')"

      - name: Check required configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is not configured for this repository or pull request."
            echo "Fork pull requests cannot access repository secrets; run this workflow from a trusted branch or configure the secret."
            exit 1
          fi

      - name: Run AI Code Reviewer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python main.py "${{ github.repository }}" "${{ github.event.pull_request.number }}"